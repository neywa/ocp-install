# cluster-rbac-argocd.yaml
#
# WARNING — this grants the Argo CD application controller CLUSTER-ADMIN
# (apiGroups/resources/verbs all "*"), including read access to every Secret in
# every namespace. It is a LAB CONVENIENCE only. Do NOT copy this into a shared
# or customer cluster.
#
# It is applied only when ARGOCD_CLUSTER_RBAC=true (default: false); see the
# README "Open questions" section — it may be redundant with the permissions the
# OpenShift GitOps operator already grants the default openshift-gitops instance.
#
# The supported way to scope Argo CD permissions is an AppProject with
# clusterResourceWhitelist / namespaceResourceWhitelist, not a hand-rolled
# cluster-admin ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-application-controller-cluster-admin-role # Choose a descriptive name
rules:
- apiGroups: ["*"] # All API groups
  resources: ["*"] # All resources
  verbs: ["*"] # All verbs (create, delete, get, list, patch, update, watch)

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-application-controller-cluster-admin-binding
subjects:
- kind: ServiceAccount
  name: openshift-gitops-argocd-application-controller
  namespace: openshift-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-application-controller-cluster-admin-role # Must match the ClusterRole name
